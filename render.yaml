services:
  - type: web
    name: reading-list-tracker-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CORS_ORIGINS
        value: https://reading-list-tracker.vercel.app,http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,http://127.0.0.1:8000,http://[::1]:5500,http://[::]:5500
